apiVersion: v1
kind: Namespace
metadata:
  name: dockfire
  labels:
    app.kubernetes.io/name: dockfire
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockfire
  namespace: dockfire
  labels:
    app: dockfire
    app.kubernetes.io/name: dockfire
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dockfire
  template:
    metadata:
      labels:
        app: dockfire
        app.kubernetes.io/name: dockfire
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: web
          image: harbor.dataknife.net/library/dockfire:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DOCKFIRE_SERVICES
              value: /usr/share/nginx/html/services.json
            - name: DOCKFIRE_SERVICES_LOCAL
              value: /usr/share/nginx/html/services.local.json
            - name: DOCKFIRE_CHECK_TIMEOUT
              value: "2.0"
          envFrom:
            # Optional — create with ./scripts/apply-energy-secret.sh
            - secretRef:
                name: dockfire-energy
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
            - name: cache
              mountPath: /var/cache/nginx
            - name: services-local
              mountPath: /usr/share/nginx/html/services.local.json
              subPath: services.local.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: cache
          emptyDir: {}
        # Created from gitignored deploy/private/services.local.json — not in git.
        - name: services-local
          configMap:
            name: dockfire-services-local
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: dockfire
  namespace: dockfire
  labels:
    app: dockfire
spec:
  selector:
    app: dockfire
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dockfire
  namespace: dockfire
  labels:
    app: dockfire
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: dockfire.dataknife.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dockfire
                port:
                  number: 80
