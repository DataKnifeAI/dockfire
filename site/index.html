<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dockfire — homelab health</title>
  <meta name="description" content="High-level health overview with deep links into admin pages." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <p class="brand-name">dockfire</p>
      <p class="brand-tag">homelab health · admin deep links</p>
    </div>
    <div class="top-meta">
      <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab active" data-view="health">Health</button>
        <button type="button" class="tab" data-view="wiki">Wiki</button>
      </nav>
      <span id="summary" class="summary">loading…</span>
      <button type="button" id="refresh" class="refresh">Refresh</button>
    </div>
  </header>

  <main>
    <section class="hero-strip" aria-label="Overview">
      <img src="assets/dockfire-hero.jpg?v=4" alt="" width="1600" height="900" />
    </section>

    <div id="view-health">
      <section class="stats" aria-label="Fleet stats" id="stats">
        <div class="stat"><span class="stat-value" id="stat-online">—</span><span class="stat-label">online</span></div>
        <div class="stat"><span class="stat-value" id="stat-down">—</span><span class="stat-label">down</span></div>
        <div class="stat"><span class="stat-value" id="stat-latency">—</span><span class="stat-label">avg latency</span></div>
        <div class="stat"><span class="stat-value" id="stat-kinds">—</span><span class="stat-label">kinds</span></div>
        <div class="stat"><span class="stat-value" id="stat-checked">—</span><span class="stat-label">last check</span></div>
      </section>

      <section aria-labelledby="surfaces-title">
        <div class="section-head">
          <h1 id="surfaces-title">Local infra</h1>
          <p>Cluster-side DNS resolve + TCP check. Open the admin page when something is wrong.</p>
        </div>
        <div id="kind-filters" class="kind-filters" hidden></div>
        <div id="grid" class="grid" role="list"></div>
      </section>
    </div>

    <div id="view-wiki" hidden>
      <section aria-labelledby="wiki-title">
        <div class="section-head">
          <h1 id="wiki-title">Wiki</h1>
          <p id="wiki-intro"></p>
        </div>
        <div id="wiki-body" class="wiki-body"></div>
        <ul id="wiki-notes" class="wiki-notes"></ul>
      </section>
    </div>
  </main>

  <footer class="foot">
    <p><a href="https://github.com/DataKnifeAI/dockfire">dockfire</a> · DataKnifeAI · internal · <code>/api/status</code></p>
  </footer>

  <template id="tile-template">
    <article class="tile" role="listitem">
      <div class="tile-top">
        <span class="dot" data-status></span>
        <h2 class="tile-name"></h2>
        <span class="tile-kind"></span>
      </div>
      <p class="tile-desc"></p>
      <div class="tile-metrics">
        <span class="metric" data-metric="latency"></span>
        <span class="metric" data-metric="resolved"></span>
      </div>
      <p class="tile-probe"></p>
      <a class="tile-link" target="_blank" rel="noopener noreferrer">Open admin</a>
    </article>
  </template>

  <script src="app.js?v=4" defer></script>
</body>
</html>
